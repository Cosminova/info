			shellPath = /bin/sh;
			shellScript = "# Builds the renderer and puts it inside the bundle.\n#\n# The web app is a Vite build and Xcode knows nothing about npm, so this is the\n# seam between the two. It runs after the Resources phase rather than before it,\n# so that what it writes is in place when the bundle is signed.\n#\n# `build:ios` rather than `build`: a separate Vite mode over the phone and\n# tablet asset set, which is what a device will actually hold, written to\n# dist-ios so that a Mac build and an iOS build do not overwrite each other.\n\nset -euo pipefail\n\nROOT=\"${SRCROOT}/..\"\nDEST=\"${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/web\"\n\ncd \"$ROOT\"\n\n# The escape hatch, and the reason it is not a nicety: an asset build is minutes\n# of work and 160 MB of output, which is not what is wanted when the thing being\n# checked is whether the Swift still compiles, or when CI has already staged a\n# bundle of its own. With this set the phase copies a dist-ios that is already\n# there and nothing else, and says so rather than failing when there is none,\n# because a shell-only build is a legitimate thing to ask for.\nif [ \"${COSMINOVA_SKIP_WEB_BUILD:-0}\" = \"1\" ]; then\n  if [ -d dist-ios ]; then\n    mkdir -p \"$DEST\"\n    rsync -a --delete dist-ios/ \"$DEST/\"\n  else\n    echo \"warning: COSMINOVA_SKIP_WEB_BUILD=1 and there is no dist-ios, so this bundle has no renderer in it and will show its missing-assets alert on launch.\"\n  fi\n  exit 0\nfi\n\n# Build phases get a PATH with none of the usual places a Node lives on it, so\n# an npm that works perfectly in the developer's shell is invisible here unless\n# it is put back.\nexport PATH=\"/opt/homebrew/bin:/usr/local/bin:$HOME/.volta/bin:/usr/bin:/bin:$PATH\"\nif [ -s \"$HOME/.nvm/nvm.sh\" ]; then . \"$HOME/.nvm/nvm.sh\" >/dev/null 2>&1 || true; fi\n\nif ! command -v npm >/dev/null 2>&1; then\n  echo \"error: npm is not on PATH, so the renderer cannot be built. Install Node, or run 'npm run build:ios' in the repository root and build again.\"\n  exit 1\nfi\n\n[ -d node_modules ] || npm ci\nnpm run build:ios\n\nif [ ! -f dist-ios/index.html ]; then\n  echo \"error: npm run build:ios finished but dist-ios/index.html is not there.\"\n  exit 1\nfi\n\nmkdir -p \"$DEST\"\n# --delete so that an asset removed from the build does not linger in the bundle\n# from an earlier one. Incremental, which matters even at this size.\nrsync -a --delete dist-ios/ \"$DEST/\"\n";
