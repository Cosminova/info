			runOnlyForDeploymentPostprocessing = 0;
			shellPath = /bin/sh;
			shellScript = "# Builds the renderer and puts it inside the bundle.\n#\n# The web app is a Vite build and Xcode knows nothing about npm, so this is\n# the seam between the two. It runs after the Resources phase rather than\n# before it, so that what it writes is in place when the bundle is signed.\n\nset -euo pipefail\n\nROOT=\"${SRCROOT}/..\"\nDEST=\"${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/web\"\n\n# Build phases get a PATH with none of the usual places a Node lives on it, so\n# an npm that works perfectly in the developer's shell is invisible here\n# unless it is put back.\nexport PATH=\"/opt/homebrew/bin:/usr/local/bin:$HOME/.volta/bin:/usr/bin:/bin:$PATH\"\nif [ -s \"$HOME/.nvm/nvm.sh\" ]; then . \"$HOME/.nvm/nvm.sh\" >/dev/null 2>&1 || true; fi\n\nif ! command -v npm >/dev/null 2>&1; then\n  echo \"error: npm is not on PATH, so the renderer cannot be built. Install Node, or run 'npm run build' in the repository root and build again.\"\n  exit 1\nfi\n\ncd \"$ROOT\"\n[ -d node_modules ] || npm ci\nnpm run build\n\nif [ ! -f dist/index.html ]; then\n  echo \"error: npm run build finished but dist/index.html is not there.\"\n  exit 1\nfi\n\nmkdir -p \"$DEST\"\n# --delete so that an asset removed from the build does not linger in the\n# bundle from an earlier one. Incremental, which matters: this is 176 MB.\nrsync -a --delete dist/ \"$DEST/\"\n";
		};
