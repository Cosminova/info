name: Deploy site

# Publishes the landing page at / and the app at /app, which is what
# scripts/build-site.mjs assembles into _site.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# A queued deploy should wait rather than cancel: cancelling a Pages deploy
# mid-flight can leave the site on a half-published state.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install
        run: npm ci

      - name: Build the renderer
        run: npm run build

      - name: Assemble the site
        run: node scripts/build-site.mjs

      - uses: actions/configure-pages@v5

      # The bulk of this is the texture and elevation set under public/, which
      # Vite copies into dist/ — a good deal larger than a normal Pages upload,
      # and the reason the deploy takes a few minutes.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
